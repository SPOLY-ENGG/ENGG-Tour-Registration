<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register for a tour — Engineering Open House</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Back to home</a>

  <header class="top">
    <div>
      <h1 id="tourTitle">Loading…</h1>
      <p class="sub" id="tourShortDesc"></p>
    </div>
    <div class="top-actions">
      <span class="day-badge" id="dayBadge">Day –</span>
    </div>
  </header>

  <p class="status-line" id="statusLine">Loading tour information…</p>

  <div class="slot-grid" id="slotGrid"></div>

  <section class="panel booking-panel" id="bookingPanel" hidden>
    <h2>Your selections</h2>
    <ul class="selection-list" id="selectionList"></ul>
    <div class="field-row">
      <label for="emailInput">Your email (the person attending)</label>
      <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field-row">
      <label for="participantsInput">Number of participants in your group (max 5)</label>
      <input type="number" id="participantsInput" min="1" max="5" value="1">
      <p class="field-hint" id="participantsWarning" hidden>⚠ You can only enter up to 5 participants.</p>
    </div>
    <button type="button" class="btn primary" id="submitBtn">Register</button>
    <p class="form-msg" id="formMsg"></p>
  </section>

  <section class="panel confirm-panel" id="confirmPanel" hidden>
    <h2>✅ Registration confirmed</h2>
    <p id="confirmMeeting"></p>
    <ul id="confirmList"></ul>
    <p class="muted">Please show this screen when joining the tour.</p>
    <button type="button" class="btn ghost" id="newRegBtn">Make another registration</button>
  </section>

  <footer class="site-footer">Built with vanilla HTML, CSS &amp; JavaScript — no frameworks, no build step.</footer>
</div>

<script src="register.js"></script>
</body>
</html>
