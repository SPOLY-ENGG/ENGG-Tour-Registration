<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Information — Engineering Open House</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Back to home</a>

  <header class="top">
    <div>
      <h1>Tour Information</h1>
      <p class="sub">What each tour covers, with photos.</p>
    </div>
  </header>

  <p class="status-line" id="statusLine">Loading tour information…</p>

  <nav class="home-grid" id="tourIconNav"></nav>

  <main id="toursRoot"></main>

  <footer class="site-footer">Built with vanilla HTML, CSS &amp; JavaScript — no frameworks, no build step.</footer>
</div>

<!-- Edit mode modal (photo/full description) — shared across all 3
     tour cards; the Save handler knows which tour via editModal.dataset.tourId -->
<div class="modal-backdrop" id="editModal" hidden>
  <div class="modal wide">
    <h2>Edit this tour's details</h2>
    <div class="edit-field">
      <label>Background photo URL</label>
      <input type="text" id="f-hero" placeholder="https://example.com/photo.jpg">
    </div>
    <div class="edit-field">
      <label>Full description</label>
      <textarea id="f-detail" style="min-height:160px"></textarea>
    </div>
    <div class="edit-field">
      <label>Location (shown as a badge above "What to expect")</label>
      <input type="text" id="f-location" placeholder="e.g. Advance Manufacturing Centre W1314">
    </div>
    <div class="edit-field">
      <label>Google Maps search term (what the location badge links to — can differ from the text above, e.g. "SP Aerohub" instead of a room number)</label>
      <input type="text" id="f-map-query" placeholder="e.g. SP Aerohub">
    </div>
    <div class="edit-field">
      <label>"What to expect" activities</label>
      <div id="f-activities"></div>
      <button type="button" class="btn ghost" id="addActivityBtn" style="margin-top:8px;">+ Add activity</button>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="editCancel">Cancel</button>
      <button type="button" class="btn primary" id="editSave">Save changes</button>
    </div>
    <p class="form-msg" id="editMsg"></p>
  </div>
</div>

<script src="tours-info.js"></script>
</body>
</html>
