<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Brochure — Engineering Open House</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Back to home</a>

  <header class="top">
    <div>
      <h1 id="brochureTitle">Loading…</h1>
    </div>
    <div class="top-actions">
      <button type="button" class="btn ghost" id="editBtn">✎ Edit</button>
    </div>
  </header>

  <p class="status-line" id="statusLine"></p>

  <main id="brochureRoot"></main>

  <footer class="site-footer">Built with vanilla HTML, CSS &amp; JavaScript — no frameworks, no build step.</footer>
</div>

<!-- Edit mode modal -->
<div class="modal-backdrop" id="editModal" hidden>
  <div class="modal">
    <h2>Edit Course Brochure page</h2>
    <div class="edit-field">
      <label>Page title</label>
      <input type="text" id="f-title" placeholder="Course Brochure">
    </div>
    <div class="edit-field">
      <label>Description</label>
      <textarea id="f-description" style="min-height:90px"></textarea>
    </div>
    <div class="edit-field">
      <label>Download link (what the Download button links to)</label>
      <input type="text" id="f-pdf" placeholder="https://example.com/brochure.pdf">
    </div>
    <div class="edit-field">
      <label>Preview link (shown in the inline viewer — can differ from the download link, e.g. a Google Drive preview link)</label>
      <input type="text" id="f-view" placeholder="https://drive.google.com/file/d/FILE_ID/preview">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="editCancel">Cancel</button>
      <button type="button" class="btn primary" id="editSave">Save changes</button>
    </div>
    <p class="form-msg" id="editMsg"></p>
  </div>
</div>

<script src="course-brochure.js"></script>
</body>
</html>
