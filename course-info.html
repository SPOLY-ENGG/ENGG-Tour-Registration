<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Information — Engineering Open House</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← Back to home</a>

  <header class="top">
    <div>
      <h1 id="courseTitle">Loading…</h1>
    </div>
    <div class="top-actions">
      <button type="button" class="btn ghost" id="editBtn">✎ Edit</button>
    </div>
  </header>

  <p class="status-line" id="statusLine"></p>

  <main id="courseRoot"></main>

  <footer class="site-footer">Built with vanilla HTML, CSS &amp; JavaScript — no frameworks, no build step.</footer>
</div>

<!-- Edit mode modal -->
<div class="modal-backdrop" id="editModal" hidden>
  <div class="modal">
    <h2>Edit Course Information page</h2>
    <div class="edit-field">
      <label>Page title</label>
      <input type="text" id="f-title" placeholder="Our Engineering Courses">
    </div>
    <div class="edit-field">
      <label>Background photo URL</label>
      <input type="text" id="f-hero" placeholder="https://example.com/photo.jpg">
    </div>
    <div class="edit-field">
      <label>Video URL (direct .mp4 link, or a YouTube link)</label>
      <input type="text" id="f-video" placeholder="https://example.com/video.mp4">
    </div>
    <div class="edit-field">
      <label>Body text</label>
      <textarea id="f-body" style="min-height:160px"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="editCancel">Cancel</button>
      <button type="button" class="btn primary" id="editSave">Save changes</button>
    </div>
    <p class="form-msg" id="editMsg"></p>
  </div>
</div>

<script src="course-info.js"></script>
</body>
</html>
